# NIBM HDSE 26.2FT - EAD02: Gym Management Application Configuration
# ===================================================================

server.port=8080
spring.application.name=gym-management-api

# --- Database Configuration: MySQL (XAMPP phpMyAdmin) ---
spring.datasource.url=jdbc:mysql://localhost:3306/gym_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Web Console (Disabled when running MySQL)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- Swagger / OpenAPI 3 Configuration ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

